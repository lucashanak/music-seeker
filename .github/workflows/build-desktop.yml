name: Build Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  # Single source of truth for "what version are we building, and does it get released".
  # - Manual tag push (git tag vX.Y.Z && git push): build+release exactly that version.
  # - Push to main touching desktop/** or this workflow: auto-bump the patch version
  #   from the latest vX.Y.Z tag and build+release it.
  # - workflow_dispatch (manual re-run/smoke test): build only, no tag, no release —
  #   so testing the pipeline never creates a spurious public release.
  # The auto-created tag is pushed with the default GITHUB_TOKEN, which by GitHub design
  # does NOT trigger a new workflow run — so this can't recurse, and it's fine because
  # this same run already does the build+release (no need for a second run to pick it up).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      should_release: ${{ steps.compute.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            SHOULD_RELEASE=true
            echo "Manual tag push: building $TAG"
          elif [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
            LATEST="${LATEST:-v0.0.0}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            VERSION="${TAG#v}"
            SHOULD_RELEASE=true
            echo "Auto-release: $LATEST -> $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Auto release $TAG (desktop/ changed)"
            git push origin "$TAG"
          else
            TAG=""
            VERSION="1.0.0"
            SHOULD_RELEASE=false
            echo "workflow_dispatch smoke test: build only, no release"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  Tag: $TAG  Release: $SHOULD_RELEASE"
        env:
          GH_TOKEN: ${{ github.token }}

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i.bak "s/\"version\": \"1.0.0\"/\"version\": \"${VERSION}\"/" desktop/src-tauri/tauri.conf.json
          sed -i.bak "s/__APP_VERSION__/${VERSION}/" desktop/src-tauri/tauri.conf.json
          rm -f desktop/src-tauri/tauri.conf.json.bak
          echo "Building version: $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: macos-rust-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: macos-rust-

      - name: Generate icons
        run: |
          cd desktop/src-tauri/icons
          if ! command -v rsvg-convert &>/dev/null; then
            brew install librsvg
          fi
          for size in 32 128 256 512 1024; do
            rsvg-convert -w $size -h $size icon.svg > icon_${size}.png
          done
          cp icon_512.png icon.png
          mkdir -p icon.iconset
          cp icon_32.png icon.iconset/icon_16x16@2x.png
          cp icon_128.png icon.iconset/icon_128x128.png
          cp icon_256.png icon.iconset/icon_128x128@2x.png
          cp icon_256.png icon.iconset/icon_256x256.png
          cp icon_512.png icon.iconset/icon_256x256@2x.png
          cp icon_512.png icon.iconset/icon_512x512.png
          cp icon_1024.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri app
        working-directory: desktop
        run: npx tauri build

      - name: Rename DMG
        run: |
          cd desktop/src-tauri/target/release/bundle/dmg
          for f in *.dmg; do mv "$f" "MusicSeeker.dmg"; done

      - name: Compute SHA-256
        id: sha_dmg
        run: |
          SHA=$(shasum -a 256 desktop/src-tauri/target/release/bundle/dmg/MusicSeeker.dmg | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "DMG SHA-256: $SHA"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicSeeker-macOS
          path: desktop/src-tauri/target/release/bundle/dmg/MusicSeeker.dmg

      - name: Release
        if: needs.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: desktop/src-tauri/target/release/bundle/dmg/MusicSeeker.dmg
          body: |
            sha256-dmg:${{ steps.sha_dmg.outputs.sha256 }}
          draft: false

  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/\"version\": \"1.0.0\"/\"version\": \"${VERSION}\"/" desktop/src-tauri/tauri.conf.json
          sed -i "s/__APP_VERSION__/${VERSION}/" desktop/src-tauri/tauri.conf.json
          echo "Building version: $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: linux-rust-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: linux-rust-

      - name: Install system dependencies
        run: |
          # Dev headers to COMPILE against — the shipped binary dynamically links the
          # runtime libs (libwebkit2gtk-4.1.so.0 etc.), which the user's distro provides.
          # Built on 22.04 (glibc 2.35) so the binary stays forward-compatible with newer
          # rolling distros (Manjaro/Arch): a binary built against older glibc runs on
          # newer, not vice-versa. webkit2gtk-4.1 keeps a stable .so.0 soname across the
          # 4.1 series, so Arch's newer 4.1 build loads it fine.
          sudo apt-get update
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            librsvg2-bin

      - name: Generate icon
        run: |
          # tauri::generate_context! reads bundle.icon (icons/icon.png) at COMPILE time
          # for the default window icon — required even with --no-bundle. Only icon.png
          # is needed here (no bundler, so no .icns/.ico).
          cd desktop/src-tauri/icons
          rsvg-convert -w 512 -h 512 icon.svg > icon.png
          # bundle.icon also lists icon.icns; generate_context! may stat every listed
          # path, so satisfy it with a placeholder (never parsed as real ICNS here).
          cp icon.png icon.icns

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri app (no bundle — rely on system WebKitGTK)
        working-directory: desktop
        # --no-bundle skips the AppImage bundler entirely, producing just the executable
        # that links the SYSTEM webkit2gtk at runtime (~14 MB vs an ~81 MB AppImage that
        # bundled the whole 180 MB WebKitGTK/GTK/ICU stack). Runtime requirement on the
        # user's machine: webkit2gtk-4.1 (Manjaro/Arch: `pacman -S webkit2gtk-4.1`).
        run: npx tauri build --no-bundle

      - name: Collect binary
        run: |
          strip desktop/src-tauri/target/release/music-seeker || true
          cp desktop/src-tauri/target/release/music-seeker MusicSeeker-linux
          ls -la MusicSeeker-linux

      - name: Compute SHA-256
        id: sha_linux
        run: |
          SHA=$(sha256sum MusicSeeker-linux | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "Linux binary SHA-256: $SHA"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicSeeker-Linux
          path: MusicSeeker-linux

      - name: Release
        if: needs.version.outputs.should_release == 'true'
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          FILE="MusicSeeker-linux"
          if gh release view "$TAG" &>/dev/null; then
            EXISTING_BODY=$(gh release view "$TAG" --json body -q '.body')
            NEW_BODY="${EXISTING_BODY}
          sha256-linux:${{ steps.sha_linux.outputs.sha256 }}"
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --notes "$NEW_BODY"
          else
            BODY="sha256-linux:${{ steps.sha_linux.outputs.sha256 }}"
            gh release create "$TAG" "$FILE" --title "$TAG" --notes "$BODY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Native Arch/Manjaro package (.pkg.tar.zst) built from the system-webkit binary
  # produced by build-linux. Installs the executable + .desktop launcher + icon, so
  # MusicSeeker shows up in the applications menu and uninstalls cleanly via
  # `pacman -R music-seeker`. makepkg only runs on Arch, so we drive it through an
  # archlinux:base-devel container via `docker run` (rather than a job `container:`,
  # which trips up the JS actions' node runtime) as a non-root build user.
  package-arch:
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: MusicSeeker-Linux
          path: dl

      - name: Assemble PKGBUILD dir
        run: |
          sudo apt-get update && sudo apt-get install -y -qq librsvg2-bin
          mkdir -p pkgbuild
          cp desktop/packaging/PKGBUILD pkgbuild/
          cp desktop/packaging/music-seeker.desktop pkgbuild/
          rsvg-convert -w 512 -h 512 desktop/src-tauri/icons/icon.svg > pkgbuild/music-seeker.png
          cp dl/MusicSeeker-linux pkgbuild/music-seeker
          chmod +x pkgbuild/music-seeker
          # Stamp the real version into the placeholder pkgver.
          sed -i "s/^pkgver=.*/pkgver=${{ needs.version.outputs.version }}/" pkgbuild/PKGBUILD

      - name: Build package (makepkg in Arch container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/pkgbuild:/pkg" archlinux:base-devel bash -c '
            useradd -m builder &&
            cp -r /pkg /home/builder/build &&
            chown -R builder /home/builder/build &&
            cd /home/builder/build &&
            sudo -u builder makepkg -f --noconfirm --nodeps &&
            cp *.pkg.tar.zst /pkg/
          '
          PKG=$(ls pkgbuild/*.pkg.tar.zst | head -1)
          cp "$PKG" "MusicSeeker-manjaro-x86_64.pkg.tar.zst"
          ls -la MusicSeeker-manjaro-x86_64.pkg.tar.zst

      - name: Compute SHA-256
        id: sha_pkg
        run: |
          SHA=$(sha256sum MusicSeeker-manjaro-x86_64.pkg.tar.zst | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "pkg SHA-256: $SHA"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicSeeker-Manjaro
          path: MusicSeeker-manjaro-x86_64.pkg.tar.zst

      - name: Release
        if: needs.version.outputs.should_release == 'true'
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          FILE="MusicSeeker-manjaro-x86_64.pkg.tar.zst"
          if gh release view "$TAG" &>/dev/null; then
            EXISTING_BODY=$(gh release view "$TAG" --json body -q '.body')
            NEW_BODY="${EXISTING_BODY}
          sha256-pkg:${{ steps.sha_pkg.outputs.sha256 }}"
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --notes "$NEW_BODY"
          else
            BODY="sha256-pkg:${{ steps.sha_pkg.outputs.sha256 }}"
            gh release create "$TAG" "$FILE" --title "$TAG" --notes "$BODY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/\"version\": \"1.0.0\"/\"version\": \"${VERSION}\"/" desktop/src-tauri/tauri.conf.json
          sed -i "s/__APP_VERSION__/${VERSION}/" desktop/src-tauri/tauri.conf.json
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Setup toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: android-rust-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: android-rust-

      - name: Setup project
        run: |
          sudo apt-get install -y -qq librsvg2-bin
          cd desktop/src-tauri/icons
          for size in 48 72 96 144 192 512; do
            rsvg-convert -w $size -h $size icon.svg > icon_${size}.png
          done
          cp icon_512.png icon.png

      - name: Install dependencies & init
        working-directory: desktop
        run: |
          npm install
          npx tauri android init

      - name: Patch Android project
        run: |
          GEN="desktop/src-tauri/gen/android"
          ICONS="desktop/src-tauri/icons"
          RES="$GEN/app/src/main/res"

          # Icons
          cp "$ICONS/icon_48.png"  "$RES/mipmap-mdpi/ic_launcher.png"
          cp "$ICONS/icon_72.png"  "$RES/mipmap-hdpi/ic_launcher.png"
          cp "$ICONS/icon_96.png"  "$RES/mipmap-xhdpi/ic_launcher.png"
          cp "$ICONS/icon_144.png" "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp "$ICONS/icon_192.png" "$RES/mipmap-xxxhdpi/ic_launcher.png"
          cp "$ICONS/icon_48.png"  "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$ICONS/icon_72.png"  "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$ICONS/icon_96.png"  "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$ICONS/icon_144.png" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$ICONS/icon_192.png" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          # Permissions
          MANIFEST="$GEN/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' "$MANIFEST"
          # Register AudioService + FileProvider inside <application>
          sed -i '/<\/application>/i \
              <service android:name=".AudioService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\
              <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_provider_paths" /></provider>' "$MANIFEST"

          # FileProvider paths config
          mkdir -p "$RES/xml"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths>' '    <cache-path name="updates" path="updates/" />' '</paths>' > "$RES/xml/file_provider_paths.xml"

          # MainActivity
          MAIN_ACT=$(find "$GEN" -name "MainActivity.kt" | head -1)
          PACKAGE=$(head -1 "$MAIN_ACT" | sed 's/package //')
          MAIN_DIR=$(dirname "$MAIN_ACT")
          cat > "$MAIN_ACT" << KOTLIN
          package $PACKAGE

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import androidx.activity.enableEdgeToEdge
          import androidx.core.content.FileProvider
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowInsetsCompat
          import java.io.File
          import java.lang.ref.WeakReference
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : TauriActivity() {
              companion object {
                  var webViewRef: WeakReference<WebView>? = null
                  fun evaluateJs(js: String) {
                      webViewRef?.get()?.post { webViewRef?.get()?.evaluateJavascript(js, null) }
                  }
              }

              private val bridge = AndroidBridge()

              inner class AndroidBridge {
                  @JavascriptInterface
                  fun onPlay(title: String, artist: String) {
                      val intent = Intent(this@MainActivity, AudioService::class.java).apply {
                          action = "ACTION_PLAY"
                          putExtra("title", title)
                          putExtra("artist", artist)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent)
                      else startService(intent)
                  }

                  @JavascriptInterface
                  fun onPause() {
                      startService(Intent(this@MainActivity, AudioService::class.java).apply {
                          action = "ACTION_PAUSE"
                      })
                  }

                  @JavascriptInterface
                  fun onStop() {
                      startService(Intent(this@MainActivity, AudioService::class.java).apply {
                          action = "ACTION_STOP"
                      })
                  }

                  @JavascriptInterface
                  fun onProgress(positionMs: Long, durationMs: Long) {
                      startService(Intent(this@MainActivity, AudioService::class.java).apply {
                          action = "ACTION_PROGRESS"
                          putExtra("position", positionMs)
                          putExtra("duration", durationMs)
                      })
                  }

                  @JavascriptInterface
                  fun installApk(downloadUrl: String) {
                      Thread {
                          try {
                              evaluateJs("window._apkProgress && window._apkProgress(0, 'Downloading...')")
                              val updateDir = File(cacheDir, "updates")
                              updateDir.mkdirs()
                              val apkFile = File(updateDir, "update.apk")
                              val conn = URL(downloadUrl).openConnection() as HttpURLConnection
                              conn.instanceFollowRedirects = true
                              conn.connect()
                              val total = conn.contentLength.toLong()
                              var downloaded = 0L
                              conn.inputStream.use { input ->
                                  apkFile.outputStream().use { output ->
                                      val buf = ByteArray(8192)
                                      while (true) {
                                          val n = input.read(buf)
                                          if (n < 0) break
                                          output.write(buf, 0, n)
                                          downloaded += n
                                          if (total > 0) {
                                              val pct = (downloaded * 100 / total).toInt()
                                              val dlKb = downloaded / 1024
                                              val totKb = total / 1024
                                              evaluateJs("window._apkProgress && window._apkProgress(\$pct, 'Downloading: \$dlKb/\$totKb KB')")
                                          }
                                      }
                                  }
                              }
                              conn.disconnect()
                              evaluateJs("window._apkProgress && window._apkProgress(100, 'Installing...')")
                              val pkgName = packageName
                              val uri = FileProvider.getUriForFile(this@MainActivity, "\$pkgName.fileprovider", apkFile)
                              val intent = Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(uri, "application/vnd.android.package-archive")
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION
                              }
                              startActivity(intent)
                          } catch (e: Exception) {
                              val msg = e.message ?: "Unknown error"
                              evaluateJs("window._apkProgress && window._apkProgress(-1, 'Failed: \$msg')")
                          }
                      }.start()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge()
                  super.onCreate(savedInstanceState)

                  // Status bar padding
                  val rootView: View = findViewById(android.R.id.content)
                  ViewCompat.setOnApplyWindowInsetsListener(rootView) { v, insets ->
                      val systemBars = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      val imeVisible = insets.isVisible(WindowInsetsCompat.Type.ime())
                      val imeHeight = insets.getInsets(WindowInsetsCompat.Type.ime()).bottom
                      val bottomPadding = if (imeVisible) imeHeight else systemBars.bottom
                      v.setPadding(systemBars.left, systemBars.top, systemBars.right, bottomPadding)
                      insets
                  }

                  // Request notification permission (API 33+)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  injectBridge()
              }

              override fun onResume() {
                  super.onResume()
                  // Re-inject bridge every time activity resumes — WebView binding
                  // can become stale after Android suspends the process during inactivity
                  injectBridge()
              }

              override fun onDestroy() {
                  startService(Intent(this, AudioService::class.java).apply { action = "ACTION_STOP" })
                  super.onDestroy()
              }

              private fun injectBridge() {
                  val handler = Handler(Looper.getMainLooper())
                  fun tryInject(attempt: Int) {
                      handler.postDelayed({
                          try {
                              val webView = findWebView(window.decorView)
                              if (webView != null) {
                                  webViewRef = WeakReference(webView)
                                  webView.addJavascriptInterface(bridge, "AndroidBridge")
                                  webView.post { webView.evaluateJavascript("window._androidBridgeReady && window._androidBridgeReady()", null) }
                              } else if (attempt < 10) {
                                  tryInject(attempt + 1)
                              }
                          } catch (e: Exception) {
                              if (attempt < 10) tryInject(attempt + 1)
                          }
                      }, if (attempt == 0) 300L else 500L)
                  }
                  tryInject(0)
              }

              private fun findWebView(view: View): WebView? {
                  if (view is WebView) return view
                  if (view is android.view.ViewGroup) {
                      for (i in 0 until view.childCount) {
                          val found = findWebView(view.getChildAt(i))
                          if (found != null) return found
                      }
                  }
                  return null
              }
          }
          KOTLIN
          sed -i 's/^          //' "$MAIN_ACT"

          # AudioService.kt
          cat > "$MAIN_DIR/AudioService.kt" << KOTLIN
          package $PACKAGE

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.support.v4.media.MediaMetadataCompat
          import android.support.v4.media.session.MediaSessionCompat
          import android.support.v4.media.session.PlaybackStateCompat
          import androidx.core.app.NotificationCompat
          import androidx.media.app.NotificationCompat as MediaNotificationCompat

          class AudioService : Service() {
              private var mediaSession: MediaSessionCompat? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var currentTitle = ""
              private var currentArtist = ""
              private var currentPosition = 0L
              private var currentDuration = 0L
              private var pauseStopHandler: Handler? = null
              private var pauseStopRunnable: Runnable? = null
              private val CHANNEL_ID = "audio_playback"
              private val NOTIFICATION_ID = 1
              private val PAUSE_STOP_DELAY_MS = 5L * 60 * 1000  // Stop service 5 min after pause

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  mediaSession = MediaSessionCompat(this, "MusicSeeker").apply {
                      setCallback(object : MediaSessionCompat.Callback() {
                          override fun onPlay() { MainActivity.evaluateJs("window._androidMediaAction('play')") }
                          override fun onPause() { MainActivity.evaluateJs("window._androidMediaAction('pause')") }
                          override fun onSkipToNext() { MainActivity.evaluateJs("window._androidMediaAction('next')") }
                          override fun onSkipToPrevious() { MainActivity.evaluateJs("window._androidMediaAction('prev')") }
                      })
                      isActive = true
                  }
                  pauseStopHandler = Handler(Looper.getMainLooper())
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      "ACTION_PLAY" -> {
                          cancelPauseStop()
                          acquireWakeLock()
                          currentTitle = intent.getStringExtra("title") ?: currentTitle
                          currentArtist = intent.getStringExtra("artist") ?: currentArtist
                          updateNotification(true)
                      }
                      "ACTION_PAUSE" -> {
                          releaseWakeLock()
                          updateNotification(false)
                          schedulePauseStop()
                      }
                      "ACTION_PROGRESS" -> {
                          currentPosition = intent.getLongExtra("position", 0L)
                          currentDuration = intent.getLongExtra("duration", 0L)
                          updatePlaybackState(true)
                      }
                      "ACTION_STOP" -> {
                          cancelPauseStop()
                          releaseWakeLock()
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                      }
                  }
                  return START_NOT_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  cancelPauseStop()
                  mediaSession?.release()
                  releaseWakeLock()
                  super.onDestroy()
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  // User swiped app from recents — clean up
                  cancelPauseStop()
                  releaseWakeLock()
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
                  super.onTaskRemoved(rootIntent)
              }

              private fun acquireWakeLock() {
                  if (wakeLock == null) {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "MusicSeeker::Audio")
                  }
                  if (wakeLock?.isHeld != true) wakeLock?.acquire(60L * 60 * 1000)  // Max 1 hour
              }

              private fun releaseWakeLock() {
                  wakeLock?.let { if (it.isHeld) it.release() }
              }

              private fun schedulePauseStop() {
                  cancelPauseStop()
                  pauseStopRunnable = Runnable {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                  }
                  pauseStopHandler?.postDelayed(pauseStopRunnable!!, PAUSE_STOP_DELAY_MS)
              }

              private fun cancelPauseStop() {
                  pauseStopRunnable?.let { pauseStopHandler?.removeCallbacks(it) }
                  pauseStopRunnable = null
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(CHANNEL_ID, "Audio Playback", NotificationManager.IMPORTANCE_LOW).apply {
                          description = "Background audio playback"
                          setSound(null, null)
                      }
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  }
              }

              private var isCurrentlyPlaying = false

              private fun updatePlaybackState(isPlaying: Boolean) {
                  isCurrentlyPlaying = isPlaying
                  mediaSession?.setPlaybackState(PlaybackStateCompat.Builder()
                      .setState(
                          if (isPlaying) PlaybackStateCompat.STATE_PLAYING else PlaybackStateCompat.STATE_PAUSED,
                          currentPosition, 1f
                      )
                      .setActions(
                          PlaybackStateCompat.ACTION_PLAY or PlaybackStateCompat.ACTION_PAUSE
                          or PlaybackStateCompat.ACTION_SKIP_TO_NEXT or PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS
                          or PlaybackStateCompat.ACTION_SEEK_TO
                      )
                      .build())
              }

              private fun updateNotification(isPlaying: Boolean) {
                  mediaSession?.setMetadata(MediaMetadataCompat.Builder()
                      .putString(MediaMetadataCompat.METADATA_KEY_TITLE, currentTitle)
                      .putString(MediaMetadataCompat.METADATA_KEY_ARTIST, currentArtist)
                      .putLong(MediaMetadataCompat.METADATA_KEY_DURATION, currentDuration)
                      .build())
                  updatePlaybackState(isPlaying)

                  val stopIntent = PendingIntent.getService(this, 0,
                      Intent(this, AudioService::class.java).apply { action = "ACTION_STOP" },
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)

                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(currentTitle)
                      .setContentText(currentArtist)
                      .setOngoing(isPlaying)
                      .setSilent(true)
                      .setDeleteIntent(stopIntent)
                      .setStyle(MediaNotificationCompat.MediaStyle()
                          .setMediaSession(mediaSession?.sessionToken)
                          .setShowActionsInCompactView(0, 1, 2))
                      .addAction(NotificationCompat.Action(android.R.drawable.ic_media_previous, "Prev",
                          androidx.media.session.MediaButtonReceiver.buildMediaButtonPendingIntent(this, PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS)))
                      .addAction(NotificationCompat.Action(
                          if (isPlaying) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play,
                          if (isPlaying) "Pause" else "Play",
                          androidx.media.session.MediaButtonReceiver.buildMediaButtonPendingIntent(this,
                              if (isPlaying) PlaybackStateCompat.ACTION_PAUSE else PlaybackStateCompat.ACTION_PLAY)))
                      .addAction(NotificationCompat.Action(android.R.drawable.ic_media_next, "Next",
                          androidx.media.session.MediaButtonReceiver.buildMediaButtonPendingIntent(this, PlaybackStateCompat.ACTION_SKIP_TO_NEXT)))
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }
              }
          }
          KOTLIN
          sed -i 's/^          //' "$MAIN_DIR/AudioService.kt"

          # Dependencies
          GRADLE="$GEN/app/build.gradle.kts"
          sed -i '/dependencies {/a \    implementation("androidx.activity:activity-ktx:1.9.0")' "$GRADLE"
          sed -i '/dependencies {/a \    implementation("androidx.media:media:1.7.0")' "$GRADLE"

      - name: Build Android APK
        working-directory: desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx tauri android build --apk --target aarch64

      - name: Sign APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/release.keystore
          APK=$(find desktop/src-tauri/gen/android -name "*.apk" | head -1)
          BT=${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)
          ${BT}/zipalign -v 4 "$APK" /tmp/aligned.apk
          ${BT}/apksigner sign \
            --ks /tmp/release.keystore --ks-key-alias musicseeker \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --out desktop/MusicSeeker.apk /tmp/aligned.apk
          ${BT}/apksigner verify desktop/MusicSeeker.apk

      - name: Compute SHA-256
        id: sha_apk
        run: |
          SHA=$(sha256sum desktop/MusicSeeker.apk | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "APK SHA-256: $SHA"

      - name: Generate delta patch
        id: delta
        run: |
          sudo apt-get install -y -qq bsdiff
          # Download previous release APK
          PREV_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Previous release: $PREV_TAG"
            gh release download "$PREV_TAG" -p "MusicSeeker.apk" -D /tmp/prev/ 2>/dev/null || true
            if [ -f /tmp/prev/MusicSeeker.apk ]; then
              PREV_VER="${PREV_TAG#v}"
              PATCH_NAME="patch-${PREV_VER}-to-${VERSION}.bspatch"
              bsdiff /tmp/prev/MusicSeeker.apk desktop/MusicSeeker.apk "desktop/${PATCH_NAME}"
              PATCH_SIZE=$(stat -c%s "desktop/${PATCH_NAME}")
              APK_SIZE=$(stat -c%s "desktop/MusicSeeker.apk")
              # Only include patch if it's <80% of APK size
              THRESHOLD=$((APK_SIZE * 80 / 100))
              if [ "$PATCH_SIZE" -lt "$THRESHOLD" ]; then
                echo "patch_file=desktop/${PATCH_NAME}" >> $GITHUB_OUTPUT
                echo "patch_name=${PATCH_NAME}" >> $GITHUB_OUTPUT
                echo "Delta patch: ${PATCH_NAME} ($(numfmt --to=iec $PATCH_SIZE) vs $(numfmt --to=iec $APK_SIZE) APK)"
              else
                echo "Patch too large (${PATCH_SIZE} >= ${THRESHOLD}), skipping"
                rm "desktop/${PATCH_NAME}"
              fi
            else
              echo "No previous APK found, skipping delta patch"
            fi
          else
            echo "No previous release found, skipping delta patch"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicSeeker-Android
          path: desktop/MusicSeeker.apk

      - name: Release
        if: needs.version.outputs.should_release == 'true'
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          FILES="desktop/MusicSeeker.apk"
          if [ -n "${{ steps.delta.outputs.patch_file }}" ]; then
            FILES="$FILES ${{ steps.delta.outputs.patch_file }}"
          fi
          # Check if release already exists (macOS job may have created it)
          if gh release view "$TAG" &>/dev/null; then
            # Append APK + patch to existing release, update body with APK hash
            EXISTING_BODY=$(gh release view "$TAG" --json body -q '.body')
            NEW_BODY="${EXISTING_BODY}
          sha256-apk:${{ steps.sha_apk.outputs.sha256 }}"
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes "$NEW_BODY"
          else
            BODY="sha256-apk:${{ steps.sha_apk.outputs.sha256 }}"
            gh release create "$TAG" $FILES --title "$TAG" --notes "$BODY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
