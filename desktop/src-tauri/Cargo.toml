[package]
name = "music-seeker"
version = "1.0.0"
edition = "2021"

[lib]
name = "music_seeker_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
# dynamic-acl: needed for Manager::add_capability, which grants IPC to the
# server URL a self-hoster configures at runtime (see server_url in lib.rs).
tauri = { version = "2", features = ["dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
